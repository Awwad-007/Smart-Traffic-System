<div style="margin-top: 40px; padding: 15px; background: rgba(0,0,0,0.3); border-radius: 10px;">
    <p style="margin:0; font-size: 12px; color: #8b949e;">SYSTEM HEARTBEAT</p>
    <p>⏱️ Next Cycle: <span id="timer" style="color: var(--neon-blue); font-weight: bold;">10s</span></p>
    <p id="mode-status" style="font-size: 11px; color: #3fb950;">MODE: AUTO-ROTATION</p>
</div>

<script>
    let timeLeft = 10;
    setInterval(() => {
        timeLeft--;
        if (timeLeft < 0) timeLeft = 10;
        document.getElementById('timer').innerText = timeLeft + "s";
    }, 1000);

    // Refresh the page every 5 seconds to keep the Map and Chart live
    setTimeout(() => { location.reload(); }, 5000);
</script>
